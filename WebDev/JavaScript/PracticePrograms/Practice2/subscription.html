<!doctype html>
<html>
    <head>
        <title>Streaming Subscription</title>
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <div class="container">
            <h1>Streaming Access 🎬</h1>

            <select id="plan">

        <script src="subscription.js"></script>
    </body>
</html>
