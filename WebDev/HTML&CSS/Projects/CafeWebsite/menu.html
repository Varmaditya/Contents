<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Sunrise Cafe — Menu</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="stylesheet" href="styles.css">
        <style>
            /* small page-specific tweak */
            .menu-header {display:flex;justify-content:space-between;align-items:center}
        </style>
    </head>
    <body>
        <header class="container menu-header">
            <h1>Sunrise Cafe — Menu</h1>
            <nav aria-label="Menu navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            </nav>
        </header>

        <main class="container">
            <section>
            <h2>Breakfast</h2>
            <ul class="menu-list">
                <li><span>Classic Poha</span><span>₹120</span></li>
                <li><span>Masala Omelette</span><span>₹140</span></li>
                <li><span>Avocado Toast</span><span>₹180</span></li>
            </ul>
            </section>

            <section>
            <h2>Coffee & Drinks</h2>
            <ul class="menu-list">
                <li><span>Signature Latte</span><span>₹110</span></li>
                <li><span>Espresso</span><span>₹80</span></li>
                <li><span>Fresh Juice</span><span>₹130</span></li>
            </ul>
            </section>

            <section>
            <h2>Order Online</h2>
            <form action="/order" method="post">
                <label for="item">Select item</label>
                <select id="item" name="item">
                <option value="poha">Classic Poha</option>
                <option value="latte">Signature Latte</option>
                <option value="croissant">Baked Croissant</option>
                </select>

                <label for="qty">Quantity</label>
                <input type="number" id="qty" name="qty" min="1" value="1">

                <label for="notes">Notes (optional)</label>
                <textarea id="notes" name="notes" rows="3"></textarea>

                <button class="primary" type="submit">Place Order</button>
            </form>
            </section>
        </main>

        <footer class="container">
            <p class="small">&copy; 2025 Sunrise Cafe</p>
        </footer>
    </body>
</html>
